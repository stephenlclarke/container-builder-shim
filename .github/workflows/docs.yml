name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - Documentation/**
      - Makefile
      - README.md
      - scripts/make-docs.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - Documentation/**
      - Makefile
      - README.md
      - scripts/make-docs.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Build DocC Documentation
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout container-builder-shim
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate static DocC site
        run: make docs

      - name: Upload DocC artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-builder-shim-docc
          path: _site
          retention-days: 7
