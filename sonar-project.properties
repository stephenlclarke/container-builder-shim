sonar.projectKey=stephenlclarke_container-builder-shim
sonar.organization=stephenlclarke
sonar.projectName=container-builder-shim
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=bin/**,_site/**,docs/**,vendor/**,**/*.pb.go,**/*_grpc.pb.go
sonar.coverage.exclusions=main.go,**/*.pb.go,**/*_grpc.pb.go
sonar.go.coverage.reportPaths=coverage.out
sonar.qualitygate.wait=true

# The workflow-run publisher accepts only a successful push to the current main
# SHA before it checks out that immutable commit. Sonar cannot follow the
# validation through the preceding job output.
sonar.issue.ignore.multicriteria=currentPublisherAuthority
sonar.issue.ignore.multicriteria.currentPublisherAuthority.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.currentPublisherAuthority.resourceKey=.github/workflows/current-image.yml
