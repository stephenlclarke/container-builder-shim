sonar.projectKey=stephenlclarke_container-builder-shim
sonar.organization=stephenlclarke
sonar.projectName=container-builder-shim
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=bin/**,_site/**,docs/**,vendor/**,**/*.pb.go,**/*_grpc.pb.go
sonar.coverage.exclusions=main.go,**/*.pb.go,**/*_grpc.pb.go
sonar.go.coverage.reportPaths=coverage.out
sonar.qualitygate.wait=true

# The workflow-run publisher accepts only a successful push to the current main
# SHA before it checks out that immutable commit. Sonar cannot follow the
# validation through the preceding job output.
# Debug handlers are opt-in and loopback-only, while the builder image must run
# as root to operate BuildKit inside its isolated Linux VM. Retained contexts
# belong to operation objects whose required io/fs/containerd interfaces do not
# carry a context on Read, Write, Walk, Run, or Close; they preserve caller
# cancellation across those interface calls rather than storing request data.
sonar.issue.ignore.multicriteria=currentPublisherAuthority,debugDiagnostics,builderRootUser,contentReaderContext,exporterContext,fssyncFileContext,fssyncFSContext,prefetchContext,stdioContext,streamPipelineContext,streamProcessorContext
sonar.issue.ignore.multicriteria.currentPublisherAuthority.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.currentPublisherAuthority.resourceKey=.github/workflows/current-image.yml
sonar.issue.ignore.multicriteria.debugDiagnostics.ruleKey=go:S4507
sonar.issue.ignore.multicriteria.debugDiagnostics.resourceKey=main.go
sonar.issue.ignore.multicriteria.builderRootUser.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.builderRootUser.resourceKey=Dockerfile
