sonar.issue.ignore.multicriteria.contentReaderContext.resourceKey=pkg/content/readerat.go
sonar.issue.ignore.multicriteria.exporterContext.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.exporterContext.resourceKey=pkg/exporter/exporter.go
sonar.issue.ignore.multicriteria.fssyncFileContext.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.fssyncFileContext.resourceKey=pkg/fssync/file.go
sonar.issue.ignore.multicriteria.fssyncFSContext.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.fssyncFSContext.resourceKey=pkg/fssync/fs.go
sonar.issue.ignore.multicriteria.prefetchContext.ruleKey=godre:S8242
